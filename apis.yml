name: Talko
description: Talko was a mobile business-communications startup founded by former
  Microsoft CTO Ray Ozzie and backed by a16z. Launched in September 2014, its app let
  mobile teams call, text, and exchange voice and video messages, recording live
  conversations with in-call bookmarks, tagging, and asynchronous voice follow-ups.
  Microsoft acquired the company in December 2015 to bolster Skype, and the Talko
  service was fully shut down by March 2016. The company is defunct with no live
  developer platform, website, or API surface; it remains in the API Evangelist
  network as an a16z portfolio record.
